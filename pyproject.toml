[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dsa-repro"
version = "0.1.0"
description = "Clean-room reproduction of Dynamic Semantic Adaptation for Efficient LLM Inference"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "DSA reproduction contributors"}]
dependencies = [
  "torch==2.1.0",
  "transformers==4.36.0",
  "datasets==2.16.1",
  "numpy>=1.24,<2",
  "scipy>=1.10,<2",
  "pandas>=2.0,<3",
  "PyYAML>=6,<7",
  "matplotlib>=3.7,<4",
  "typer>=0.12,<1",
  "openai>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.6,<1", "build>=1,<2"]

[project.scripts]
dsa-repro = "dsa_repro.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/dsa_repro/cli.py" = ["B008"]
